<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Matcher</title>
    <link rel="stylesheet" href="Matcher.css">
    <script src="Matcher.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="title">👾 MATCHER 👾</div>
        <div class="attempts">Attempts: <span id="attempts">0</span></div>
        <div class="stats">
            <p>Time: <span id="time">0.0</span>s</p>
            <p>🏆 Fewest attempts: <span id="bestAttempts">-</span></p>
            <p>⚡ Fastest time: <span id="bestTime">-</span></p>
        </div>
            <p class="sound-note">🔊 Play with sound on </p>
        <div class="game-board" id="gameBoard"></div>
        <div class="win-message" id="winMessage">🎉 You matched them all! You win! 🎉</div>
        <button type="button" class="reset-btn" id="resetBtn">New game</button>
    </div>
</body>

</html>
